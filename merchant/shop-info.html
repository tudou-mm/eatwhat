<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店铺信息 · 商家端</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .cover-preview {
    height: 200px; border-radius: var(--radius); overflow: hidden;
    background: var(--bg-hover); position: relative; margin-bottom: 8px;
  }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
  .cover-preview__mask {
    position: absolute; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .2s; cursor: pointer;
  }
  .cover-preview:hover .cover-preview__mask { opacity: 1; }
  .cover-preview__btn {
    background: #fff; padding: 8px 18px; border-radius: 8px; font-size: 13px;
  }

  .map-box {
    height: 200px; border-radius: var(--radius); overflow: hidden;
    background: #E8EEF4; position: relative; margin-top: 8px;
    background-image:
      linear-gradient(rgba(0,0,0,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,.045) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .map-pin {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%);
    font-size: 26px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.3));
  }

  .photo-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .pg-item {
    aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden;
    background: var(--bg-hover); position: relative;
  }
  .pg-item img { width: 100%; height: 100%; object-fit: cover; }
  .pg-item__del {
    position: absolute; top: 4px; right: 4px; width: 18px; height: 18px;
    border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .pg-add {
    aspect-ratio: 1; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3); cursor: pointer; background: #fff; font-size: 18px;
  }
  .pg-add:hover { border-color: var(--brand); color: var(--brand); }

  .review-tip {
    display: flex; gap: 10px; align-items: flex-start;
    background: #FFF7E6; border-radius: var(--radius); padding: 14px;
    font-size: 13px; color: #D46B08; line-height: 1.7; margin-bottom: 20px;
  }

  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: #1A1A1A; color: #fff; padding: 10px 20px; border-radius: var(--radius);
    font-size: 13px; z-index: 200; opacity: 0; transition: all .3s;
  }
  .toast.is-show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .sensitive {
    position: relative;
  }
  .sensitive__badge {
    font-size: 11px; padding: 1px 6px; border-radius: 3px;
    background: #FFF7E6; color: #D46B08; margin-left: 6px;
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar__logo"><div class="sidebar__logo-dot"></div><span>吃什么 · 商家</span></div>
    <nav class="sidebar__nav">
      <a class="nav-item" href="dashboard.html">工作台</a>
      <a class="nav-item" href="publish.html">发布菜品</a>
      <a class="nav-item" href="dishes.html">菜品管理</a>
      <a class="nav-item is-active" href="shop-info.html">店铺信息</a>
      <a class="nav-item" href="comments.html">评论管理</a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar__title">店铺信息</div>
      <div class="topbar__spacer"></div>
      <a class="btn btn--sm btn--outline" href="../client/shop.html?id=s_001" target="_blank">查看前台效果</a>
      <div class="topbar__user">
        <div class="avatar">蜀</div>
        <span style="font-size:13px">蜀香小馆</span>
      </div>
    </header>

    <div class="content" style="max-width:820px">

      <div class="review-tip">
        <span>⚠️</span>
        <span>
          <b>店铺名称、门头图、地址</b>属于审核信息，修改后需重新审核，
          审核期间不影响已发布菜品的展示。
        </span>
      </div>

      <div class="card mb-16">
        <div class="card__head">
          <div class="card__title">门头图</div>
          <div class="card__spacer"></div>
          <span class="tag tag--neutral">用于客户端店铺头图</span>
        </div>
        <div class="card__body">
          <!-- 真实文件选择，由上面的遮罩触发 -->
          <input type="file" id="coverInput" accept="image/*" hidden onchange="onCoverPicked(event)">
          <div class="cover-preview">
            <img id="coverImg" src="">
            <div class="cover-preview__mask" onclick="changeCover()">
              <div class="cover-preview__btn">更换门头图</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-16">
        <div class="card__head">
          <div class="card__title">基本信息</div>
        </div>
        <div class="card__body">
          <div class="field">
            <div class="field__label">
              店铺名称 <span class="field__required">*</span>
              <span class="sensitive__badge">需审核</span>
            </div>
            <input class="input" id="fName" maxlength="30">
          </div>

          <div class="field">
            <div class="field__label">菜系分类 <span class="field__required">*</span></div>
            <select class="select" id="fCuisine"></select>
          </div>

          <div class="field" style="margin-bottom:0">
            <div class="field__label">店铺简介</div>
            <textarea class="textarea" id="fIntro" maxlength="200"></textarea>
            <div class="char-count" id="introCount"></div>
          </div>
        </div>
      </div>

      <div class="card mb-16">
        <div class="card__head">
          <div class="card__title">地址与联系</div>
          <div class="card__spacer"></div>
          <span class="tag tag--warning">修改地址将触发重新审核</span>
        </div>
        <div class="card__body">
          <div class="field">
            <div class="field__label">
              店铺地址 <span class="field__required">*</span>
              <span class="sensitive__badge">需审核</span>
            </div>
            <div class="flex gap-8">
              <input class="input" id="fAddr" readonly>
              <button class="btn btn--outline" style="flex-shrink:0" onclick="pickMap()">重新选点</button>
            </div>
            <div class="map-box">
              <div class="map-pin">📍</div>
            </div>
            <div class="field__hint">经纬度影响「附近」推荐的距离排序</div>
          </div>

          <div class="field">
            <div class="field__label">联系电话 <span class="field__required">*</span></div>
            <input class="input" id="fPhone" maxlength="20">
          </div>

          <div class="field" style="margin-bottom:0">
            <div class="field__label">营业时间 <span class="field__required">*</span></div>
            <div class="flex items-center gap-8">
              <input class="input" id="fOpen" style="max-width:120px">
              <span class="text-3">至</span>
              <input class="input" id="fClose" style="max-width:120px">
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-20">
        <div class="card__head">
          <div class="card__title">店铺照片</div>
          <div class="card__subtitle">选填，最多 6 张</div>
        </div>
        <div class="card__body">
          <input type="file" id="photoInput" accept="image/*" multiple hidden onchange="onPhotoPicked(event)">
          <div class="photo-grid" id="photoGrid"></div>
        </div>
      </div>

      <div class="flex gap-12">
        <button class="btn btn--ghost btn--lg" onclick="location.reload()">放弃修改</button>
        <button class="btn btn--primary btn--lg flex-1" onclick="save()">保存修改</button>
      </div>

    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="../assets/data/mock.js"></script>
<script src="../assets/js/api.js"></script>
<script>
let shop = null;
let photos = [];
let coverOverride = null;   // 换过但还没保存的门头图

(function init() {
  shop = MOCK.getShop(MOCK.currentMerchant.shopId);
  // 接后端后可能取不到店（身份 id 对不上）——给提示，别让 shop.cuisine 崩页面
  if (!shop) { toast('未识别到你的店铺，请重新登录商家端'); return; }

  document.getElementById('fCuisine').innerHTML =
    MOCK.cuisines.map(c => `<option ${c === shop.cuisine ? 'selected' : ''}>${c}</option>`).join('');

  document.getElementById('coverImg').src = shop.cover;
  document.getElementById('fName').value = shop.name;
  document.getElementById('fIntro').value = shop.intro;
  document.getElementById('fAddr').value = shop.address;
  document.getElementById('fPhone').value = shop.phone;

  const [o, c] = shop.hours.split(' - ');
  document.getElementById('fOpen').value = o;
  document.getElementById('fClose').value = c;

  photos = [
    'https://picsum.photos/seed/shopph1/300/300',
    'https://picsum.photos/seed/shopph2/300/300',
    'https://picsum.photos/seed/shopph3/300/300'
  ];
  renderPhotos();
  onIntro();

  document.getElementById('fIntro').addEventListener('input', onIntro);
})();

function onIntro() {
  document.getElementById('introCount').textContent =
    document.getElementById('fIntro').value.length + ' / 200';
}

function renderPhotos() {
  const g = document.getElementById('photoGrid');
  let html = photos.map((p, i) => `
    <div class="pg-item">
      <img src="${p}">
      <div class="pg-item__del" onclick="delPhoto(${i})">×</div>
    </div>`).join('');
  if (photos.length < 6) html += '<div class="pg-add" onclick="addPhoto()">+</div>';
  g.innerHTML = html;
}

function addPhoto() {
  if (photos.length >= 6) { toast('最多 6 张'); return; }
  document.getElementById('photoInput').click();
}

function onPhotoPicked(ev) {
  const files = Array.from(ev.target.files || []);
  ev.target.value = '';
  if (!files.length) return;
  const room = 6 - photos.length;
  const list = files.slice(0, room);
  if (files.length > room) toast('最多 6 张，已忽略多余的 ' + (files.length - room) + ' 张');
  Promise.all(list.map(f => MOCK.upload(f)
      .then(r => r.url)
      .catch(e => { toast('「' + f.name + '」上传失败：' + e.message); return null; })))
    .then(urls => {
      urls.filter(Boolean).forEach(u => photos.push(u));
      renderPhotos();
      if (urls.some(Boolean)) toast('保存后生效');
    });
}

function delPhoto(i) {
  photos.splice(i, 1);
  renderPhotos();
}

function changeCover() {
  document.getElementById('coverInput').click();
}

function onCoverPicked(ev) {
  const f = (ev.target.files || [])[0];
  ev.target.value = '';
  if (!f) return;
  if (!f.type.startsWith('image/')) { toast('门头图必须是图片'); return; }
  // 只改「待保存」的本地值，不直接写 shop.cover ——
  // 直接写会把还没保存的改动混进缓存，用户点取消也回不去了
  MOCK.upload(f).then(r => {
    coverOverride = r.url;
    document.getElementById('coverImg').src = coverOverride;
    toast('门头图已更换，保存后需重新审核');
  }).catch(e => toast('上传失败：' + e.message));
}

function pickMap() {
  toast('已重新选点（原型模拟）');
}

function save() {
  if (!shop) return;
  const name = document.getElementById('fName').value.trim();
  if (!name) { toast('店铺名称不能为空'); return; }

  const oldAddr = shop.address;
  const oldCover = shop.cover;

  const payload = {
    name: name,
    cuisine: document.getElementById('fCuisine').value,
    intro: document.getElementById('fIntro').value.trim(),
    address: document.getElementById('fAddr').value,
    phone: document.getElementById('fPhone').value.trim(),
    hours: document.getElementById('fOpen').value + ' - ' + document.getElementById('fClose').value
  };
  if (coverOverride) { payload.cover = coverOverride; payload.logo = coverOverride; }

  // 落库：在线走后端，离线改本地内存
  const r = MOCK.act('merchant.shop.update', payload);
  if (!r.ok) { toast('保存失败：' + (r.msg || '未知错误')); return; }

  const saved = r.data || shop;
  shop = saved;
  coverOverride = null;
  document.getElementById('coverImg').src = saved.cover;

  const needReview = oldAddr !== saved.address || oldCover !== saved.cover;
  toast(needReview ? '已保存，敏感信息将重新审核' : '已保存');

  track('merchant_save_shop', { needReview });
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-show'), 2000);
}

function track(event, data) { console.log('[track]', event, data); }
</script>
</body>
</html>
