<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家登录 · 吃什么</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  body { background: #F7F8FA; min-height: 100vh; display: flex; }

  .left {
    width: 44%; background: linear-gradient(150deg, #1A1A1A 0%, #2B1B20 100%);
    display: flex; flex-direction: column; justify-content: center;
    padding: 60px; color: #fff; position: relative; overflow: hidden;
  }

  .left::after {
    content: ''; position: absolute; width: 400px; height: 400px;
    border-radius: 50%; background: radial-gradient(circle, rgba(254,44,85,.35), transparent 70%);
    right: -140px; bottom: -100px;
  }

  .left__logo { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
  .left__dot { width: 32px; height: 32px; border-radius: 10px; background: var(--brand-gradient); }
  .left__name { font-size: 17px; font-weight: 600; }

  .left h1 { font-size: 34px; font-weight: 600; line-height: 1.35; margin-bottom: 18px; position: relative; z-index: 2; }
  .left p { font-size: 14px; color: rgba(255,255,255,.55); line-height: 1.9; position: relative; z-index: 2; }

  .left__list { margin-top: 36px; position: relative; z-index: 2; }
  .left__item { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; font-size: 14px; color: rgba(255,255,255,.8); }
  .left__check {
    width: 18px; height: 18px; border-radius: 50%; background: rgba(254,44,85,.2);
    color: var(--brand); display: flex; align-items: center; justify-content: center;
    font-size: 11px; flex-shrink: 0; margin-top: 2px;
  }

  .right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }

  .form-box { width: 100%; max-width: 380px; }

  .form-box__title { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
  .form-box__sub { font-size: 13px; color: var(--text-3); margin-bottom: 32px; }

  .tabs { display: flex; gap: 24px; margin-bottom: 26px; border-bottom: 1px solid var(--border); }

  .tab {
    padding-bottom: 12px; font-size: 15px; color: var(--text-3);
    cursor: pointer; position: relative; transition: color .15s;
  }
  .tab.is-active { color: var(--text-1); font-weight: 500; }
  .tab.is-active::after {
    content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
    height: 2px; background: var(--brand); border-radius: 1px;
  }

  .quick-tip {
    background: #FFF7E6; color: #D46B08; font-size: 12px;
    padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 20px;
    line-height: 1.6;
  }

  .footer-tip {
    text-align: center; font-size: 12px; color: var(--text-4);
    margin-top: 24px; line-height: 1.7;
  }

  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: #1A1A1A; color: #fff; padding: 10px 20px; border-radius: var(--radius);
    font-size: 13px; z-index: 200; opacity: 0; transition: all .3s;
  }
  .toast.is-show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 900px) {
    .left { display: none; }
  }
</style>
</head>
<body>

<div class="left">
  <div class="left__logo">
    <div class="left__dot"></div>
    <div class="left__name">吃什么 · 商家端</div>
  </div>
  <h1>每天一道新菜<br>让人找上门来</h1>
  <p>发布今日新菜，附近食客在首页直接看到你。免费入驻，一条街一条街地传出去。</p>

  <div class="left__list">
    <div class="left__item"><div class="left__check">✓</div><span>图文 / 视频，随手就能发</span></div>
    <div class="left__item"><div class="left__check">✓</div><span>首页展示，按距离推荐给附近的人</span></div>
    <div class="left__item"><div class="left__check">✓</div><span>浏览、点赞、打卡数据一目了然</span></div>
  </div>
</div>

<div class="right">
  <div class="form-box">
    <div class="tabs">
      <div class="tab is-active" data-tab="login" onclick="switchTab('login')">登录</div>
      <div class="tab" data-tab="register" onclick="switchTab('register')">立即入驻</div>
    </div>

    <!-- 登录 -->
    <div id="viewLogin">
      <div class="form-box__title">欢迎回来</div>
      <div class="form-box__sub">登录后管理你的店铺与菜品</div>

      <div class="quick-tip">
        原型提示：账号 <b>13800138000</b>，密码任意，直接登录查看「蜀香小馆」
      </div>

      <div class="field">
        <div class="field__label">手机号</div>
        <input class="input" id="acct" value="13800138000" placeholder="请输入手机号" maxlength="11">
      </div>

      <div class="field">
        <div class="field__label">密码</div>
        <input class="input" id="pwd" type="password" value="123456" placeholder="请输入密码">
      </div>

      <div class="flex-between mb-20">
        <label class="flex items-center gap-6" style="font-size:13px;color:var(--text-2);cursor:pointer">
          <span class="cbx-dot"></span>记住我
        </label>
        <span class="text-13 text-brand" style="cursor:pointer" onclick="alert('原型未实现')">忘记密码？</span>
      </div>

      <button class="btn btn--primary btn--lg btn--block" onclick="doLogin()">登录</button>

      <div class="footer-tip">
        还没有账号？<span class="text-brand" style="cursor:pointer" onclick="switchTab('register')">立即入驻</span><br>
        <span style="color:var(--text-4)">我是食客，<span class="text-brand" style="cursor:pointer" onclick="location.href='../client/feed.html'">去客户端 ›</span></span>
      </div>
    </div>

    <!-- 注册 -->
    <div id="viewRegister" class="hidden">
      <div class="form-box__title">商家入驻</div>
      <div class="form-box__sub">提交资料后由平台审核，通过即可发布</div>

      <div class="field">
        <div class="field__label">手机号 <span class="field__required">*</span></div>
        <input class="input" id="rPhone" placeholder="用于登录与联系" maxlength="11">
      </div>

      <div class="field">
        <div class="field__label">设置密码 <span class="field__required">*</span></div>
        <input class="input" id="rPwd" type="password" placeholder="至少 6 位">
      </div>

      <div class="alert alert--info mb-20">
        <span>ⓘ</span>
        <span>手机号与密码填完后，下一步填写店铺资料（店名、门头图、地址、电话等）。</span>
      </div>

      <button class="btn btn--primary btn--lg btn--block" onclick="goApply()">下一步：填写店铺资料</button>

      <div class="footer-tip">
        已有账号？<span class="text-brand" style="cursor:pointer" onclick="switchTab('login')">去登录</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../assets/data/mock.js"></script>
<script src="../assets/js/api.js"></script>
<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('is-active', t.dataset.tab === tab);
  });
  document.getElementById('viewLogin').classList.toggle('hidden', tab !== 'login');
  document.getElementById('viewRegister').classList.toggle('hidden', tab !== 'register');
}

function doLogin() {
  const acct = document.getElementById('acct').value.trim();
  if (!/^1\d{10}$/.test(acct)) { toast('请输入正确的手机号'); return; }
  if (!acct.startsWith('138')) {
    toast('原型中只有 13800138000 已通过审核');
  }
  toast('登录成功');
  setTimeout(() => location.href = 'dashboard.html', 700);
}

function goApply() {
  const p = document.getElementById('rPhone').value.trim();
  const w = document.getElementById('rPwd').value;
  if (!/^1\d{10}$/.test(p)) { toast('请输入正确的手机号'); return; }
  if (w.length < 6) { toast('密码至少 6 位'); return; }
  location.href = 'apply.html';
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-show'), 1800);
}
</script>
</body>
</html>
