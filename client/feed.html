<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>吃什么 · 首页</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  body { background: #1A1A1A; margin: 0; }

  /* 手机外壳：桌面端居中展示，移动端全屏 */
  .stage {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; gap: 40px; padding: 20px;
  }

  .phone-wrap { position: relative; }

  .phone {
    width: 390px; height: 844px;
    background: #000; border-radius: 44px; overflow: hidden;
    border: 10px solid #2A2A2A; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }

  .phone__notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 126px; height: 28px; background: #2A2A2A;
    border-radius: 0 0 18px 18px; z-index: 60;
  }

  /* 状态栏 */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; z-index: 55; color: #fff; font-size: 13px;
    font-weight: 500; pointer-events: none;
  }

  /* Tab */
  .feed-tabs {
    position: absolute; top: 48px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 26px; z-index: 50;
    padding-bottom: 4px;
  }

  .feed-tab {
    font-size: 16px; color: rgba(255,255,255,.55); position: relative;
    padding-bottom: 8px; cursor: pointer; transition: color .2s;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }

  .feed-tab.is-active { color: #fff; font-weight: 500; }

  .feed-tab.is-active::after {
    content: ''; position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%); width: 22px; height: 3px;
    background: #fff; border-radius: 2px;
  }

  /* 筛选按钮 */
  .filter-btn {
    position: absolute; top: 48px; right: 16px; z-index: 50;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,.15); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; cursor: pointer;
  }

  /* 信息流 */
  .feed {
    position: absolute; inset: 0; overflow-y: scroll;
    scroll-snap-type: y mandatory; scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }

  .fc {
    height: 100%; scroll-snap-align: start; position: relative;
    overflow: hidden;
  }

  .fc__media { position: absolute; inset: 0; background: #111; }
  .fc__media img { width: 100%; height: 100%; object-fit: cover; }

  .fc__shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 18%,
      transparent 38%, transparent 50%, rgba(0,0,0,.85) 100%);
  }

  /* 视频播放标记 */
  .fc__play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(0,0,0,.4); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px; z-index: 3; pointer-events: none;
  }

  /* 底部信息 + 操作栏 */
  .fc__body {
    position: absolute; left: 0; right: 0; bottom: 0;
    z-index: 10; padding: 0 16px 88px;
    display: flex; gap: 14px; align-items: flex-end;
  }

  .fc__info { flex: 1; min-width: 0; color: #fff; }

  .fc__tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

  .fc__tag {
    font-size: 11px; padding: 2px 7px; border-radius: 4px;
    background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
    color: #fff; line-height: 1.6;
  }

  .fc__tag--real { background: rgba(0,181,120,.85); }
  .fc__tag--ad { background: rgba(255,255,255,.2); color: rgba(255,255,255,.75); }
  .fc__tag--pending { background: rgba(255,143,31,.85); }

  .fc__dish {
    font-size: 23px; font-weight: 500; margin-bottom: 6px;
    text-shadow: 0 1px 6px rgba(0,0,0,.5); line-height: 1.3;
  }

  .fc__desc {
    font-size: 13px; color: rgba(255,255,255,.8); margin-bottom: 10px;
    line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
  }

  .fc__shop {
    display: flex; align-items: center; gap: 6px; font-size: 13px;
    color: rgba(255,255,255,.85); flex-wrap: wrap;
  }

  .fc__shop-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.4); overflow: hidden; flex-shrink: 0;
  }
  .fc__shop-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .fc__price {
    font-size: 11px; padding: 2px 7px; border-radius: 4px;
    background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
  }

  /* 右侧操作栏 */
  .fc__acts {
    display: flex; flex-direction: column; gap: 20px;
    align-items: center; flex-shrink: 0; padding-bottom: 4px;
  }

  .act {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: #fff; cursor: pointer; user-select: none;
  }

  .act__icon {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,.16); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all .18s;
  }

  .act:active .act__icon { transform: scale(.88); }

  .act.is-on .act__icon { background: rgba(254,44,85,.9); }
  .act.is-on .act__icon::after { content: ''; }

  .act__num {
    font-size: 11px; text-shadow: 0 1px 3px rgba(0,0,0,.6);
    font-variant-numeric: tabular-nums;
  }

  /* 店铺卡片（可展开） */
  .shop-card {
    position: absolute; left: 16px; right: 16px; bottom: 84px;
    background: rgba(28,28,30,.92); backdrop-filter: blur(20px);
    border-radius: 14px; padding: 14px; z-index: 12;
    transform: translateY(calc(100% + 100px));
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    border: 1px solid rgba(255,255,255,.1);
  }

  .shop-card.is-open { transform: translateY(0); }

  .shop-card__head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }

  .shop-card__logo {
    width: 46px; height: 46px; border-radius: 10px; overflow: hidden;
    background: #333; flex-shrink: 0;
  }
  .shop-card__logo img { width: 100%; height: 100%; object-fit: cover; }

  .shop-card__name { font-size: 15px; font-weight: 500; color: #fff; margin-bottom: 3px; }
  .shop-card__meta { font-size: 12px; color: rgba(255,255,255,.6); line-height: 1.6; }

  .shop-card__btns { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }

  .sc-btn {
    height: 36px; border-radius: 8px; font-size: 13px;
    background: rgba(255,255,255,.12); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    transition: background .15s;
  }
  .sc-btn:hover { background: rgba(255,255,255,.2); }
  .sc-btn--primary { background: #FE2C55; }
  .sc-btn--primary:hover { background: #E62248; }

  .shop-card__close {
    position: absolute; top: -34px; right: 0;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,.15); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }

  /* 底部导航 */
  .tabbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 68px;
    background: linear-gradient(to top, rgba(0,0,0,.95), rgba(0,0,0,.6));
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 8px 10px; z-index: 40;
  }

  .tb-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: rgba(255,255,255,.5); font-size: 10px; cursor: pointer;
    padding: 6px 14px; transition: color .15s;
  }

  .tb-item.is-active { color: #fff; }
  .tb-item__icon { font-size: 19px; }

  /* 更多菜单 */
  .more-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #1C1C1E; border-radius: 18px 18px 0 0;
    padding: 8px 0 24px; z-index: 70;
    transform: translateY(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
  }
  .more-sheet.is-open { transform: translateY(0); }

  .more-sheet__handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.2); margin: 6px auto 14px;
  }

  .more-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px; color: #fff; font-size: 15px; cursor: pointer;
  }
  .more-item:hover { background: rgba(255,255,255,.06); }
  .more-item__icon {
    width: 34px; height: 34px; border-radius: 9px;
    background: rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }

  /* 遮罩 */
  .mask {
    position: absolute; inset: 0; background: rgba(0,0,0,.5);
    z-index: 65; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .mask.is-open { opacity: 1; pointer-events: auto; }

  /* 侧栏说明卡（桌面端展示用） */
  .side-note {
    width: 300px; color: #fff; font-size: 13px; line-height: 1.9;
    background: #1C1C1E; border-radius: 16px; padding: 22px;
    border: 1px solid rgba(255,255,255,.08);
  }
  .side-note h3 { font-size: 15px; font-weight: 500; margin-bottom: 14px; }
  .side-note__row { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }
  .side-note__k { color: rgba(255,255,255,.5); flex-shrink: 0; width: 62px; }
  .side-note__v { color: rgba(255,255,255,.9); flex: 1; }
  .side-note hr { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 16px 0; }
  .side-note code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  @media (max-width: 820px) {
    .stage { padding: 0; }
    .side-note { display: none; }
    .phone { width: 100vw; height: 100vh; border-radius: 0; border: none; }
    .phone__notch { display: none; }
  }
</style>
</head>
<body data-app="client">

<div class="stage">

  <!-- 手机 -->
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone__notch"></div>

      <div class="statusbar">
        <span>9:41</span>
        <span>•••  5G  ▮</span>
      </div>

      <div class="feed-tabs">
        <div class="feed-tab is-active" data-tab="nearby" onclick="switchTab('nearby')">附近</div>
        <div class="feed-tab" data-tab="random" onclick="switchTab('random')">随心看</div>
      </div>

      <div class="filter-btn" onclick="location.href='filter.html'">⚙</div>

      <!-- 信息流 -->
      <div class="feed" id="feed"></div>

      <!-- 店铺卡片 -->
      <div class="shop-card" id="shopCard">
        <div class="shop-card__close" onclick="closeShopCard()">×</div>
        <div class="shop-card__head">
          <div class="shop-card__logo"><img id="scLogo" src=""></div>
          <div style="flex:1;min-width:0">
            <div class="shop-card__name" id="scName">—</div>
            <div class="shop-card__meta" id="scMeta">—</div>
          </div>
        </div>
        <div class="shop-card__btns">
          <button class="sc-btn" onclick="callShop()">📞 电话</button>
          <button class="sc-btn" onclick="navShop()">🧭 导航</button>
          <a class="sc-btn sc-btn--primary" id="scEnter">进店看更多</a>
        </div>

      <!-- 更多菜单 -->
      <div class="mask" id="mask" onclick="closeMore()"></div>
      <div class="more-sheet" id="moreSheet">
        <div class="more-sheet__handle"></div>
        <div class="more-item" onclick="doAction('分享')">
          <div class="more-item__icon">↗</div><span>分享给朋友</span>
        </div>
        <div class="more-item" onclick="doAction('导航')">
          <div class="more-item__icon">🧭</div><span>导航到店</span>
        </div>
        <div class="more-item" onclick="doAction('电话')">
          <div class="more-item__icon">📞</div><span>拨打店铺电话</span>
        </div>
        <div class="more-item" onclick="doAction('第三方平台')">
          <div class="more-item__icon">🍜</div><span>去美团看看</span>
        </div>
      </div>

      <!-- 底部导航 -->
      <div class="tabbar">
        <div class="tb-item is-active"><div class="tb-item__icon">⌂</div><span>首页</span></div>
        <div class="tb-item" onclick="location.href='filter.html'"><div class="tb-item__icon">☰</div><span>分类</span></div>
        <div class="tb-item" onclick="location.href='profile.html'"><div class="tb-item__icon">◯</div><span>我的</span></div>
      </div>

    </div>
  </div>

  <!-- 侧栏说明 -->
  <div class="side-note">
    <h3>交互说明</h3>
    <div class="side-note__row"><span class="side-note__k">滑动</span><span class="side-note__v">上下滑切换菜品（全屏吸顶）</span></div>
    <div class="side-note__row"><span class="side-note__k">双 Tab</span><span class="side-note__v">附近＝置顶&gt;权重&gt;距离&gt;时间衰减<br>随心看＝随机且排除已浏览</span></div>
    <div class="side-note__row"><span class="side-note__k">点店名</span><span class="side-note__v">展开店铺卡片，可电话／导航／进店</span></div>
    <div class="side-note__row"><span class="side-note__k">更多</span><span class="side-note__v">分享／导航／电话／跳第三方收起在 ⋯ 里</span></div>
    <div class="side-note__row"><span class="side-note__k">未登录</span><span class="side-note__v">点赞／收藏／评论会拦截并提示登录</span></div>
    <hr>
    <div class="side-note__row"><span class="side-note__k">时间衰减</span><span class="side-note__v">超 24h 权重归零但不删除，仍可刷到</span></div>
    <div class="side-note__row"><span class="side-note__k">内容不足</span><span class="side-note__v">不足 3 条时自动回退展示旧内容</span></div>
    <hr>
    <div class="text-12" style="color:rgba(255,255,255,.4)">提示：改 <code>mock.js</code> 里 <code>currentUser.loggedIn</code> 可切换登录态</div>
  </div>

</div>

<script src="../assets/data/mock.js"></script>
<script src="../assets/js/api.js"></script>
<script>
const S = {
  tab: 'nearby',
  feed: [],
  liked: {}, favorited: {}, browsed: [],
  current: null
};

/* ---------- 初始化 ---------- */
(function init() {
  buildFeed();
})();

function buildFeed() {
  let list = MOCK.buildFeed(S.tab);

  // 规则：内容不足 3 条时，回退展示 24h 以前的旧内容（决策 D2）
  if (list.length < 3) {
    const older = MOCK.dishes.filter(d => d.status === 'normal' && MOCK.timeDecay(d.publishedAt) === 0);
    list = list.concat(older);
  }

  // 随心看：排除已浏览
  if (S.tab === 'random') {
    const unread = list.filter(d => !S.browsed.includes(d.id));
    list = unread.length ? unread : list;
  }

  S.feed = list;
  renderFeed();
}

function renderFeed() {
  const el = document.getElementById('feed');
  if (!S.feed.length) {
    el.innerHTML = '<div class="fc"><div class="flex-center" style="height:100%;color:rgba(255,255,255,.4)">暂无内容</div></div>';
    return;
  }

  el.innerHTML = S.feed.map((d, i) => {
    const shop = MOCK.getShop(d.shopId);
    const tier = MOCK.priceTiers.find(t => t.id === d.priceTierId);
    const liked = !!S.liked[d.id];
    const faved = !!S.favorited[d.id];
    const cover = d.type === 'video' ? (d.cover || d.media[0]) : d.media[0];

    return `
    <div class="fc" data-id="${d.id}">
      <div class="fc__media"><img src="${cover}" loading="lazy"></div>
      ${d.type === 'video' ? '<div class="fc__play">▶</div>' : ''}
      <div class="fc__shade"></div>

      <div class="fc__body">
        <div class="fc__info">
          <div class="fc__tags">
            ${d.realTag ? `<span class="fc__tag fc__tag--${d.realTag}">${MOCK.realName(d.realTag)}</span>` : ''}
            ${(d.tasteTags || []).map(t => `<span class="fc__tag">${t}</span>`).join('')}
            <span class="fc__tag">${MOCK.timeAgo(d.publishedAt)}</span>
          </div>
          <div class="fc__dish">${d.name}</div>
          ${d.desc ? `<div class="fc__desc">${d.desc}</div>` : ''}
          <div class="fc__shop" onclick="openShopCard('${d.shopId}')" style="cursor:pointer">
            <div class="fc__shop-avatar"><img src="${shop ? shop.logo : ''}"></div>
            <span>${d.shopName}</span>
            <span>·</span>
            <span>${shop ? shop.distance + 'km' : ''}</span>
            ${tier ? `<span class="fc__price">${tier.name}</span>` : ''}
            <span style="opacity:.7">▸</span>
          </div>
        </div>

        <div class="fc__acts">
          <div class="act ${liked ? 'is-on' : ''}" onclick="toggleLike('${d.id}', this)">
            <div class="act__icon">♥</div>
            <div class="act__num">${MOCK.fmtNum(d.stats.likes)}</div>
          </div>
          <div class="act ${faved ? 'is-on' : ''}" onclick="toggleFav('${d.id}', this)">
            <div class="act__icon">☆</div>
            <div class="act__num">${MOCK.fmtNum(d.stats.favorites)}</div>
          </div>
          <div class="act" onclick="goComment('${d.id}')">
            <div class="act__icon">💬</div>
            <div class="act__num">${MOCK.fmtNum(d.stats.comments)}</div>
          </div>
          <div class="act" onclick="openMore('${d.id}')">
            <div class="act__icon">⋯</div>
            <div class="act__num">更多</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  // 记录浏览
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.dataset.id;
        if (!S.browsed.includes(id)) S.browsed.push(id);
        S.current = id;
      }
    });
  }, { threshold: 0.6 });

  el.querySelectorAll('.fc').forEach(c => io.observe(c));
}

/* ---------- Tab ---------- */
function switchTab(tab) {
  if (S.tab === tab) return;
  S.tab = tab;
  document.querySelectorAll('.feed-tab').forEach(t => {
    t.classList.toggle('is-active', t.dataset.tab === tab);
  });
  closeShopCard();
  document.getElementById('feed').scrollTop = 0;
  buildFeed();
}

/* ---------- 登录拦截 ---------- */
function requireLogin() {
  if (MOCK.currentUser.loggedIn) return true;
  if (confirm('登录后才能点赞、收藏和评论，现在去登录？')) {
    location.href = 'login.html';
  }
  return false;
}

/* ---------- 互动 ---------- */
function toggleLike(id, el) {
  if (!requireLogin()) return;
  S.liked[id] = !S.liked[id];
  const d = MOCK.getDish(id);
  d.stats.likes += S.liked[id] ? 1 : -1;
  el.classList.toggle('is-on', S.liked[id]);
  el.querySelector('.act__num').textContent = MOCK.fmtNum(d.stats.likes);
  track('like', { dishId: id, on: S.liked[id] });
}

function toggleFav(id, el) {
  if (!requireLogin()) return;
  S.favorited[id] = !S.favorited[id];
  const d = MOCK.getDish(id);
  d.stats.favorites += S.favorited[id] ? 1 : -1;
  el.classList.toggle('is-on', S.favorited[id]);
  el.querySelector('.act__num').textContent = MOCK.fmtNum(d.stats.favorites);
  track('favorite', { dishId: id, on: S.favorited[id] });
}

function goComment(id) {
  if (!requireLogin()) return;
  location.href = 'dish.html?id=' + id;
}

/* ---------- 更多菜单 ---------- */
function openMore(id) {
  S.current = id;
  document.getElementById('mask').classList.add('is-open');
  document.getElementById('moreSheet').classList.add('is-open');
}

function closeMore() {
  document.getElementById('mask').classList.remove('is-open');
  document.getElementById('moreSheet').classList.remove('is-open');
}

function doAction(name) {
  closeMore();
  const d = MOCK.getDish(S.current);
  const shop = MOCK.getShop(d.shopId);

  if (name === '分享') {
    alert('已复制分享链接\n（可扩展：生成海报 / 唤起微信）');
  } else if (name === '导航') {
    alert('唤起地图导航\n目的地：' + shop.name + '\n' + shop.address);
  } else if (name === '电话') {
    alert('拨打：' + shop.phone);
  } else if (name === '第三方平台') {
    alert('跳转美团 / 大众点评搜索：' + shop.name + '\n（仅外链跳转，不抓取对方数据）');
  }
  track('action', { type: name, dishId: S.current });
}

/* ---------- 店铺卡片 ---------- */
function openShopCard(shopId) {
  const shop = MOCK.getShop(shopId);
  if (!shop) return;
  document.getElementById('scLogo').src = shop.logo;
  document.getElementById('scName').textContent = shop.name;
  document.getElementById('scMeta').innerHTML =
    `🕐 ${shop.hours}　·　${shop.cuisine}<br>📍 ${shop.address}　·　${shop.distance}km`;
  document.getElementById('scEnter').href = 'shop.html?id=' + shop.id;
  S.currentShop = shop;
  document.getElementById('shopCard').classList.add('is-open');
  track('shopcard_open', { shopId });
}

function closeShopCard() {
  document.getElementById('shopCard').classList.remove('is-open');
}

function callShop() {
  if (!S.currentShop) return;
  alert('拨打：' + S.currentShop.phone);
}

function navShop() {
  if (!S.currentShop) return;
  alert('导航至：' + S.currentShop.address);
}

/* ---------- 埋点占位（二期换真实实现） ---------- */
function track(event, data) {
  console.log('[track]', event, data);
}
</script>
