<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>分类筛选 · 吃什么</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  body { background: #1A1A1A; }

  .stage {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; gap: 40px; padding: 20px;
  }

  .phone {
    width: 390px; height: 844px; background: #0D0D0D;
    border-radius: 44px; overflow: hidden; border: 10px solid #2A2A2A;
    position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.6);
    display: flex; flex-direction: column;
  }

  .phone__notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 126px; height: 28px; background: #2A2A2A;
    border-radius: 0 0 18px 18px; z-index: 90;
  }

  /* 顶部 */
  .fh {
    padding: 56px 16px 14px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0;
  }
  .fh__back {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,.08); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; cursor: pointer; flex-shrink: 0;
  }
  .fh__title { font-size: 17px; font-weight: 500; color: #fff; }
  .fh__reset {
    margin-left: auto; font-size: 12px; color: rgba(255,255,255,.5);
    cursor: pointer; padding: 6px 10px;
  }
  .fh__reset:hover { color: #fff; }

  .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; padding-bottom: 90px; }
  .scroll::-webkit-scrollbar { display: none; }

  /* 筛选区块 */
  .fsec { padding: 18px 16px 4px; }

  .fsec__title {
    font-size: 13px; color: rgba(255,255,255,.5);
    margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }
  .fsec__title::before {
    content: ''; width: 3px; height: 12px; border-radius: 2px; background: #FE2C55;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    padding: 7px 16px; border-radius: 18px; font-size: 13px;
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.7);
    cursor: pointer; transition: all .15s;
    border: 1px solid transparent;
  }
  .chip:hover { background: rgba(255,255,255,.14); }

  .chip.is-on {
    background: rgba(254,44,85,.16); color: #FE2C55;
    border-color: #FE2C55; font-weight: 500;
  }

  .fsec__hint {
    font-size: 11px; color: rgba(255,255,255,.3);
    margin-top: 10px; line-height: 1.6;
  }

  /* 结果预览 */
  .result-bar {
    padding: 14px 16px 8px; font-size: 13px; color: rgba(255,255,255,.5);
    display: flex; align-items: center; gap: 6px;
  }
  .result-bar__num { color: #FE2C55; font-weight: 600; }

  .res-list { padding: 0 16px; }

  .res-item {
    display: flex; gap: 12px; padding: 12px;
    background: #161616; border-radius: 14px; margin-bottom: 10px;
    cursor: pointer;
  }
  .res-item:hover { background: #1E1E1E; }
  .res-item__img {
    width: 76px; height: 100px; border-radius: 10px; overflow: hidden;
    background: #222; flex-shrink: 0;
  }
  .res-item__img img { width: 100%; height: 100%; object-fit: cover; }
  .res-item__name { font-size: 16px; font-weight: 500; color: #fff; margin-bottom: 5px; }
  .res-item__shop { font-size: 12px; color: rgba(255,255,255,.45); margin-bottom: 8px; }
  .res-item__meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }

  /* 底部按钮 */
  .fbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 16px 24px; z-index: 85;
    background: linear-gradient(to top, rgba(13,13,13,.98) 60%, transparent);
  }
  .fbar__btn {
    width: 100%; height: 50px; border-radius: 25px;
    background: #FE2C55; color: #fff; font-size: 15px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .fbar__btn:hover { background: #E62248; }

  .side-note {
    width: 300px; color: #fff; font-size: 13px; line-height: 1.9;
    background: #1C1C1E; border-radius: 16px; padding: 22px;
    border: 1px solid rgba(255,255,255,.08);
  }
  .side-note h3 { font-size: 15px; font-weight: 500; margin-bottom: 14px; }
  .side-note__row { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }
  .side-note__k { color: rgba(255,255,255,.5); flex-shrink: 0; width: 62px; }
  .side-note__v { color: rgba(255,255,255,.9); flex: 1; }
  .side-note hr { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 16px 0; }

  @media (max-width: 820px) {
    .stage { padding: 0; }
    .side-note { display: none; }
    .phone { width: 100vw; height: 100vh; border-radius: 0; border: none; }
    .phone__notch { display: none; }
    .fh { padding-top: 20px; }
  }
</style>
</head>
<body data-app="client">

<div class="stage">
  <div class="phone">
    <div class="phone__notch"></div>

    <div class="fh">
      <div class="fh__back" onclick="location.href='feed.html'">‹</div>
      <div class="fh__title">筛选</div>
      <div class="fh__reset" onclick="reset()">重置</div>
    </div>

    <div class="scroll">
      <!-- 价格档 -->
      <div class="fsec">
        <div class="fsec__title">价格档</div>
        <div class="chips" id="chipPrice"></div>
        <div class="fsec__hint">档位区间由平台统一配置</div>
      </div>

      <!-- 口味 -->
      <div class="fsec">
        <div class="fsec__title">口味</div>
        <div class="chips" id="chipTaste"></div>
      </div>

      <!-- 距离 -->
      <div class="fsec">
        <div class="fsec__title">距离</div>
        <div class="chips">
          <div class="chip is-on" style="cursor:default">不限</div>
        </div>
        <div class="fsec__hint">本期暂不做距离范围筛选，二期开放</div>
      </div>

      <!-- 结果 -->
      <div class="result-bar">
        符合条件 <span class="result-bar__num" id="resNum">0</span> 道菜品
      </div>
      <div class="res-list" id="resList"></div>
    </div>

    <div class="fbar">
      <button class="fbar__btn" onclick="applyFilter()">
        查看结果 <span id="btnNum"></span>
      </button>
    </div>
  </div>

  <div class="side-note">
    <h3>交互说明</h3>
    <div class="side-note__row"><span class="side-note__k">价格档</span><span class="side-note__v">多选，OR 逻辑<br>选中任一档即满足</span></div>
    <div class="side-note__row"><span class="side-note__k">口味</span><span class="side-note__v">多选，OR 逻辑<br>「我想吃点辣的」</span></div>
    <div class="side-note__row"><span class="side-note__k">距离</span><span class="side-note__v">本期固定「不限」</span></div>
    <hr>
    <div class="side-note__row"><span class="side-note__k">实时</span><span class="side-note__v">勾选即时刷新下方结果</span></div>
    <div class="side-note__row"><span class="side-note__k">OR 逻辑</span><span class="side-note__v">价格与口味之间是「或」<br>不是「且」</span></div>
    <hr>
    <div class="text-12" style="color:rgba(255,255,255,.4)">
      价格档与口味跨维度取并集
    </div>
  </div>
</div>

<script src="../assets/data/mock.js"></script>
<script src="../assets/js/api.js"></script>
<script>
const S = { tiers: [], tastes: [] };

(function init() {
  document.getElementById('chipPrice').innerHTML = MOCK.priceTiers.map(t =>
    `<div class="chip" data-v="${t.id}" onclick="toggle('tiers', this)">${t.name}</div>`
  ).join('');

  document.getElementById('chipTaste').innerHTML = MOCK.tasteTags.map(t =>
    `<div class="chip" data-v="${t}" onclick="toggle('tastes', this)">${t}</div>`
  ).join('');

  render();
})();

function toggle(key, el) {
  const v = el.dataset.v;
  const i = S[key].indexOf(v);
  if (i > -1) S[key].splice(i, 1); else S[key].push(v);
  el.classList.toggle('is-on');
  render();
}

function reset() {
  S.tiers = []; S.tastes = [];
  document.querySelectorAll('.chip.is-on').forEach(c => {
    if (c.dataset.v) c.classList.remove('is-on');
  });
  render();
}

function getResult() {
  return MOCK.dishes.filter(d => d.status === 'normal').filter(d => {
    const tierOk = !S.tiers.length || S.tiers.includes(d.priceTierId);
    const tasteOk = !S.tastes.length ||
      (d.tasteTags || []).some(t => S.tastes.includes(t));
    return tierOk && tasteOk;
  });
}

function render() {
  const list = getResult();
  const n = list.length;

  document.getElementById('resNum').textContent = n;
  document.getElementById('btnNum').textContent = n ? `（${n}）` : '';

  const el = document.getElementById('resList');
  if (!n) {
    el.innerHTML = '<div class="empty" style="color:rgba(255,255,255,.4);padding:40px 0">' +
      '<div class="empty__icon">🍽</div><div class="empty__text">没有符合条件的菜品</div>' +
      '<div class="empty__hint">试试放宽筛选条件</div></div>';
    return;
  }

  el.innerHTML = list.map(d => {
    const tier = MOCK.priceTiers.find(t => t.id === d.priceTierId);
    return `
      <div class="res-item" onclick="location.href='dish.html?id=${d.id}'">
        <div class="res-item__img"><img src="${d.cover || d.media[0]}"></div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column">
          <div class="res-item__name">${d.name}</div>
          <div class="res-item__shop">🏪 ${d.shopName}</div>
          <div class="res-item__meta">
            ${tier ? `<span class="tag ${MOCK.tierClass(tier.id)}">${tier.name}</span>` : ''}
            ${(d.tasteTags || []).slice(0, 2).map(t => `<span class="tag-dark" style="font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85)">${t}</span>`).join('')}
            ${d.price ? `<span style="font-size:12px;color:#FE2C55;margin-left:auto">¥${d.price}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function applyFilter() {
  track('filter_apply', { tiers: S.tiers, tastes: S.tastes });
  location.href = 'feed.html';
}

function track(event, data) { console.log('[track]', event, data); }
</script>
</body>
</html>
