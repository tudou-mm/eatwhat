<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 · 吃什么</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  body { background: #1A1A1A; }

  .stage {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; gap: 40px; padding: 20px;
  }

  .phone {
    width: 390px; height: 844px; background: #0D0D0D;
    border-radius: 44px; overflow: hidden; border: 10px solid #2A2A2A;
    position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.6);
    display: flex; flex-direction: column;
  }

  .phone__notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 126px; height: 28px; background: #2A2A2A;
    border-radius: 0 0 18px 18px; z-index: 90;
  }

  .nav-back {
    position: absolute; top: 52px; left: 16px; z-index: 80;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,.08); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; cursor: pointer;
  }

  .body { flex: 1; padding: 100px 28px 28px; display: flex; flex-direction: column; }

  .logo-mark {
    width: 60px; height: 60px; border-radius: 18px;
    background: linear-gradient(135deg, #FE2C55, #FF6B81);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 22px;
  }

  .title { font-size: 26px; font-weight: 600; color: #fff; margin-bottom: 8px; line-height: 1.3; }
  .subtitle { font-size: 14px; color: rgba(255,255,255,.45); margin-bottom: 40px; }

  .fld { margin-bottom: 20px; }

  .fld__input-wrap {
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,.15);
    padding-bottom: 10px;
    transition: border-color .2s;
  }
  .fld__input-wrap:focus-within { border-color: #FE2C55; }

  .fld__prefix {
    font-size: 15px; color: rgba(255,255,255,.7);
    padding-right: 10px; border-right: 1px solid rgba(255,255,255,.15);
  }

  .fld__input {
    flex: 1; background: none; color: #fff; font-size: 16px;
    padding: 4px 0;
  }
  .fld__input::placeholder { color: rgba(255,255,255,.25); }

  .fld__code-btn {
    font-size: 13px; color: #FE2C55; padding: 4px 0;
    white-space: nowrap;
  }
  .fld__code-btn.is-disabled { color: rgba(255,255,255,.25); }

  .submit {
    width: 100%; height: 50px; border-radius: 25px;
    background: #FE2C55; color: #fff; font-size: 16px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    margin-top: 12px; transition: all .2s;
  }
  .submit:hover { background: #E62248; }
  .submit.is-disabled { background: rgba(255,255,255,.12); color: rgba(255,255,255,.3); }

  .agree {
    display: flex; gap: 8px; align-items: flex-start;
    margin-top: 22px; font-size: 12px; color: rgba(255,255,255,.4);
    line-height: 1.6;
  }

  .cbx {
    width: 15px; height: 15px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.3); flex-shrink: 0;
    margin-top: 1px; display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: transparent; cursor: pointer; transition: all .15s;
  }
  .cbx.is-on { background: #FE2C55; border-color: #FE2C55; color: #fff; }

  .other-way {
    margin-top: auto; text-align: center;
    font-size: 13px; color: rgba(255,255,255,.4);
  }
  .other-way span { color: #FE2C55; cursor: pointer; }

  .toast {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 10px 18px;
    border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 150; white-space: nowrap;
  }
  .toast.is-show { opacity: 1; }

  .side-note {
    width: 300px; color: #fff; font-size: 13px; line-height: 1.9;
    background: #1C1C1E; border-radius: 16px; padding: 22px;
    border: 1px solid rgba(255,255,255,.08);
  }
  .side-note h3 { font-size: 15px; font-weight: 500; margin-bottom: 14px; }
  .side-note__row { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }
  .side-note__k { color: rgba(255,255,255,.5); flex-shrink: 0; width: 62px; }
  .side-note__v { color: rgba(255,255,255,.9); flex: 1; }
  .side-note hr { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 16px 0; }

  @media (max-width: 820px) {
    .stage { padding: 0; }
    .side-note { display: none; }
    .phone { width: 100vw; height: 100vh; border-radius: 0; border: none; }
    .phone__notch { display: none; }
    .nav-back { top: 14px; }
    .body { padding-top: 70px; }
  }
</style>
</head>
<body data-app="client">

<div class="stage">
  <div class="phone">
    <div class="phone__notch"></div>
    <div class="nav-back" onclick="history.back()">‹</div>

    <div class="body">
      <div class="logo-mark">🍜</div>
      <div class="title">欢迎回来</div>
      <div class="subtitle">登录后即可点赞、收藏和评论</div>

      <div class="fld">
        <div class="fld__input-wrap">
          <span class="fld__prefix">+86</span>
          <input class="fld__input" id="phone" type="tel" maxlength="11"
                 placeholder="请输入手机号" oninput="onPhone()">
        </div>
      </div>

      <div class="fld">
        <div class="fld__input-wrap">
          <input class="fld__input" id="code" type="tel" maxlength="6"
                 placeholder="请输入验证码" oninput="onPhone()">
          <button class="fld__code-btn" id="codeBtn" onclick="sendCode()">获取验证码</button>
        </div>
      </div>

      <button class="submit is-disabled" id="submitBtn" onclick="doLogin()">登录 / 注册</button>

      <div class="agree" onclick="toggleAgree()">
        <div class="cbx" id="agreeBox">✓</div>
        <div>我已阅读并同意《用户协议》和《隐私政策》，未注册的手机号将自动创建账号</div>
      </div>

      <div class="other-way">
        我是商家，<span onclick="alert('跳转商家端登录（原型未实现）')">去商家入驻 ›</span>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div class="side-note">
    <h3>交互说明</h3>
    <div class="side-note__row"><span class="side-note__k">登录方式</span><span class="side-note__v">手机号 + 验证码<br>不设密码，降低门槛</span></div>
    <div class="side-note__row"><span class="side-note__k">注册合一</span><span class="side-note__v">未注册手机号自动创建账号</span></div>
    <div class="side-note__row"><span class="side-note__k">校验</span><span class="side-note__v">11 位手机号 + 6 位验证码<br>且需勾选协议后才可提交</span></div>
    <hr>
    <div class="side-note__row"><span class="side-note__k">验证码</span><span class="side-note__v">点击后 60 秒倒计时重发</span></div>
    <div class="side-note__row"><span class="side-note__k">商家入口</span><span class="side-note__v">底部引导商家去入驻</span></div>
    <hr>
    <div class="text-12" style="color:rgba(255,255,255,.4)">
      原型不校验验证码真伪，任意 6 位均可
    </div>
  </div>
</div>

<script src="../assets/data/mock.js"></script>
<script src="../assets/js/api.js"></script>
<script>
let agreed = false;
let counting = false;

function onPhone() {
  const p = document.getElementById('phone').value.trim();
  const c = document.getElementById('code').value.trim();
  const ok = /^1\d{10}$/.test(p) && /^\d{6}$/.test(c) && agreed;
  document.getElementById('submitBtn').classList.toggle('is-disabled', !ok);
}

function toggleAgree() {
  agreed = !agreed;
  document.getElementById('agreeBox').classList.toggle('is-on', agreed);
  onPhone();
}

function sendCode() {
  if (counting) return;
  const p = document.getElementById('phone').value.trim();
  if (!/^1\d{10}$/.test(p)) { toast('请先输入正确的手机号'); return; }

  counting = true;
  let n = 60;
  const btn = document.getElementById('codeBtn');
  btn.classList.add('is-disabled');
  btn.textContent = n + 's 后重发';
  toast('验证码已发送（原型不校验）');

  const t = setInterval(() => {
    n--;
    btn.textContent = n + 's 后重发';
    if (n <= 0) {
      clearInterval(t);
      counting = false;
      btn.classList.remove('is-disabled');
      btn.textContent = '获取验证码';
    }
  }, 1000);
}

function doLogin() {
  const ok = /^1\d{10}$/.test(document.getElementById('phone').value.trim());
  const c = document.getElementById('code').value.trim();
  if (!ok) { toast('请输入正确的手机号'); return; }
  if (!/^\d{6}$/.test(c)) { toast('请输入 6 位验证码'); return; }
  if (!agreed) { toast('请先同意用户协议'); return; }

  MOCK.currentUser.loggedIn = true;
  localStorage.setItem('loggedIn', '1');
  toast('登录成功');
  setTimeout(() => {
    const from = new URLSearchParams(location.search).get('from');
    location.href = from || 'feed.html';
  }, 700);
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-show'), 1600);
}
</script>
</body>
</html>
