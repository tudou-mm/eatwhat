<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>菜品详情 · 吃什么</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  body { background: #1A1A1A; }

  .stage {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; gap: 40px; padding: 20px;
  }

  .phone {
    width: 390px; height: 844px; background: #0D0D0D;
    border-radius: 44px; overflow: hidden; border: 10px solid #2A2A2A;
    position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.6);
    display: flex; flex-direction: column;
  }

  .phone__notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 126px; height: 28px; background: #2A2A2A;
    border-radius: 0 0 18px 18px; z-index: 90;
  }

  .nav-back {
    position: absolute; top: 52px; left: 16px; z-index: 80;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,.45); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 17px; cursor: pointer;
  }

  .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  /* 媒体轮播 */
  .gallery { position: relative; background: #000; flex-shrink: 0; }
  .gallery__track {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .gallery__track::-webkit-scrollbar { display: none; }
  .gallery__item {
    width: 390px; height: 480px; flex-shrink: 0;
    scroll-snap-align: start; position: relative;
  }
  .gallery__item img { width: 100%; height: 100%; object-fit: cover; }

  .gallery__dots {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; z-index: 5;
  }
  .gdot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.4); transition: all .2s;
  }
  .gdot.is-on { background: #fff; width: 16px; border-radius: 3px; }

  .gallery__idx {
    position: absolute; top: 56px; right: 16px; z-index: 5;
    background: rgba(0,0,0,.5); color: #fff; font-size: 12px;
    padding: 3px 10px; border-radius: var(--radius-full);
    font-variant-numeric: tabular-nums;
  }

  .gallery__video-mark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(0,0,0,.45); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px;
  }

  /* 内容区 */
  .body { padding: 18px 16px 0; }

  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tag-dark {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: rgba(255,255,255,.12); color: rgba(255,255,255,.85);
  }

  .dish-name { font-size: 24px; font-weight: 600; color: #fff; margin-bottom: 8px; }
  .dish-desc { font-size: 14px; color: rgba(255,255,255,.65); line-height: 1.7; margin-bottom: 14px; }

  .dish-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .dish-price { font-size: 20px; font-weight: 600; color: #FE2C55; }
  .dish-price__unit { font-size: 13px; font-weight: 400; }

  /* 店铺迷你卡 */
  .shop-mini {
    display: flex; align-items: center; gap: 12px;
    background: #161616; border-radius: 14px; padding: 14px;
    margin-bottom: 18px; cursor: pointer; transition: background .15s;
  }
  .shop-mini:hover { background: #1E1E1E; }
  .shop-mini__logo {
    width: 48px; height: 48px; border-radius: 11px; overflow: hidden;
    background: #222; flex-shrink: 0;
  }
  .shop-mini__logo img { width: 100%; height: 100%; object-fit: cover; }
  .shop-mini__name { font-size: 15px; font-weight: 500; color: #fff; margin-bottom: 3px; }
  .shop-mini__meta { font-size: 12px; color: rgba(255,255,255,.5); }

  /* 操作行 */
  .acts-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 14px 0; border-top: 1px solid rgba(255,255,255,.08);
    border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 18px;
  }

  .act-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 0; border-radius: 10px; color: rgba(255,255,255,.7);
    font-size: 11px; cursor: pointer; transition: all .15s;
  }
  .act-btn:hover { background: rgba(255,255,255,.06); }
  .act-btn.is-on { color: #FE2C55; }
  .act-btn__icon { font-size: 20px; }

  /* 评论 */
  .cm-head {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 16px 14px;
  }
  .cm-head__title { font-size: 15px; font-weight: 500; color: #fff; }
  .cm-head__count { font-size: 12px; color: rgba(255,255,255,.4); }

  .cm-list { padding: 0 16px 140px; }

  .cm-item { display: flex; gap: 10px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .cm-avatar {
    width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
    background: #222; flex-shrink: 0;
  }
  .cm-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .cm-body { flex: 1; min-width: 0; }
  .cm-name { font-size: 13px; color: rgba(255,255,255,.75); margin-bottom: 4px; }
  .cm-text { font-size: 14px; color: #fff; line-height: 1.6; margin-bottom: 6px; }
  .cm-time { font-size: 11px; color: rgba(255,255,255,.35); }

  /* 商家回评 */
  .cm-reply {
    background: rgba(255,255,255,.055); border-radius: 10px;
    padding: 10px 12px; margin-top: 10px; position: relative;
  }
  .cm-reply__tag {
    font-size: 11px; color: #FE2C55; font-weight: 500; margin-bottom: 4px;
    display: flex; align-items: center; gap: 4px;
  }
  .cm-reply__text { font-size: 13px; color: rgba(255,255,255,.75); line-height: 1.6; }
  .cm-reply__time { font-size: 11px; color: rgba(255,255,255,.3); margin-top: 5px; }

  /* 底部评论输入 */
  .cm-bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px 22px; z-index: 85;
    background: linear-gradient(to top, rgba(13,13,13,.98) 60%, transparent);
    display: flex; gap: 10px; align-items: center;
  }

  .cm-input {
    flex: 1; height: 42px; border-radius: 21px;
    background: rgba(255,255,255,.1); padding: 0 16px;
    color: #fff; font-size: 14px;
  }
  .cm-input::placeholder { color: rgba(255,255,255,.4); }
  .cm-input:focus { background: rgba(255,255,255,.15); }

  .cm-send {
    height: 42px; padding: 0 18px; border-radius: 21px;
    background: #FE2C55; color: #fff; font-size: 14px;
  }
  .cm-send.is-disabled { background: rgba(255,255,255,.12); color: rgba(255,255,255,.35); }

  .toast {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 10px 18px;
    border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 150; white-space: nowrap;
  }
  .toast.is-show { opacity: 1; }

  .side-note {
    width: 300px; color: #fff; font-size: 13px; line-height: 1.9;
    background: #1C1C1E; border-radius: 16px; padding: 22px;
    border: 1px solid rgba(255,255,255,.08);
  }
  .side-note h3 { font-size: 15px; font-weight: 500; margin-bottom: 14px; }
  .side-note__row { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }
  .side-note__k { color: rgba(255,255,255,.5); flex-shrink: 0; width: 62px; }
  .side-note__v { color: rgba(255,255,255,.9); flex: 1; }
  .side-note hr { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 16px 0; }

  @media (max-width: 820px) {
    .stage { padding: 0; }
    .side-note { display: none; }
    .phone { width: 100vw; height: 100vh; border-radius: 0; border: none; }
    .phone__notch { display: none; }
    .nav-back { top: 14px; }
    .gallery__item { width: 100vw; }
    .gallery__idx { top: 18px; }
  }
</style>
</head>
<body data-app="client">

<div class="stage">
  <div class="phone">
    <div class="phone__notch"></div>
    <div class="nav-back" onclick="history.back()">‹</div>

    <div class="scroll">
      <!-- 媒体 -->
      <div class="gallery">
        <div class="gallery__track" id="galleryTrack"></div>
        <div class="gallery__idx" id="galleryIdx"></div>
        <div class="gallery__dots" id="galleryDots"></div>
      </div>

      <div class="body">
        <div class="tags" id="dishTags"></div>
        <div class="dish-name" id="dishName">—</div>
        <div class="dish-desc" id="dishDesc"></div>

        <div class="dish-meta">
          <div class="dish-price" id="dishPrice"></div>
          <span class="tag-dark" id="dishTime"></span>
        </div>

        <div class="shop-mini" id="shopMini" onclick="goShop()">
          <div class="shop-mini__logo"><img id="smLogo" src=""></div>
          <div style="flex:1;min-width:0">
            <div class="shop-mini__name" id="smName">—</div>
            <div class="shop-mini__meta" id="smMeta">—</div>
          </div>
          <span style="color:rgba(255,255,255,.4);font-size:16px">›</span>
        </div>

        <div class="acts-row">
          <div class="act-btn" id="btnLike" onclick="toggleLike()">
            <div class="act-btn__icon">♥</div>
            <div id="likeNum">0</div>
          </div>
          <div class="act-btn" id="btnFav" onclick="toggleFav()">
            <div class="act-btn__icon">☆</div>
            <div id="favNum">0</div>
          </div>
          <div class="act-btn" onclick="toast('已复制菜品链接')">
            <div class="act-btn__icon">↗</div>
            <div>分享</div>
          </div>
          <div class="act-btn" onclick="goNav()">
            <div class="act-btn__icon">🧭</div>
            <div>导航</div>
          </div>
        </div>
      </div>

      <div class="cm-head">
        <div class="cm-head__title">评论</div>
        <div class="cm-head__count" id="cmCount"></div>
      </div>
      <div class="cm-list" id="cmList"></div>
    </div>

    <!-- 底部输入 -->
    <div class="cm-bar">
      <input class="cm-input" id="cmInput" placeholder="说点什么…" maxlength="100"
             oninput="onInput()" onkeydown="if(event.key==='Enter')sendComment()">
      <button class="cm-send is-disabled" id="cmSend" onclick="sendComment()">发送</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div class="side-note">
    <h3>交互说明</h3>
    <div class="side-note__row"><span class="side-note__k">媒体</span><span class="side-note__v">多图横向滑动，圆点指示器<br>视频显示播放角标</span></div>
    <div class="side-note__row"><span class="side-note__k">信息</span><span class="side-note__v">菜名 / 简介 / 价格 / 真实性标签</span></div>
    <div class="side-note__row"><span class="side-note__k">店铺</span><span class="side-note__v">迷你卡片，点击进店铺详情</span></div>
    <div class="side-note__row"><span class="side-note__k">操作</span><span class="side-note__v">点赞 / 收藏 / 分享 / 导航</span></div>
    <hr>
    <div class="side-note__row"><span class="side-note__k">评论</span><span class="side-note__v">最新优先，商家回评带「商家」标识</span></div>
    <div class="side-note__row"><span class="side-note__k">未登录</span><span class="side-note__v">点赞/收藏/评论会拦截</span></div>
    <hr>
    <div class="text-12" style="color:rgba(255,255,255,.4)">
      发的评论会实时插入列表顶部
    </div>
  </div>
</div>

<script src="../assets/data/mock.js"></script>
<script src="../assets/js/api.js"></script>
<script>
let dish = null;
let shop = null;
let state = { liked: false, faved: false };

(function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'd_001';
  dish = MOCK.getDish(id) || MOCK.dishes[0];
  shop = MOCK.getShop(dish.shopId);
  render();
})();

function render() {
  // 媒体
  const track = document.getElementById('galleryTrack');
  track.innerHTML = dish.media.map((src, i) => `
    <div class="gallery__item">
      <img src="${src}">
      ${dish.type === 'video' && i === 0 ? '<div class="gallery__video-mark">▶</div>' : ''}
    </div>
  `).join('');

  document.getElementById('galleryDots').innerHTML = dish.type === 'video'
    ? '<div class="gdot is-on"></div>'
    : dish.media.map((_, i) => `<div class="gdot ${i === 0 ? 'is-on' : ''}"></div>`).join('');

  document.getElementById('galleryIdx').textContent = dish.type === 'video'
    ? '视频'
    : `1 / ${dish.media.length}`;

  // 滑动更新圆点
  track.onscroll = () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    document.getElementById('galleryIdx').textContent = `${i + 1} / ${dish.media.length}`;
    document.querySelectorAll('.gdot').forEach((d, j) => d.classList.toggle('is-on', j === i));
  };

  // 标签
  const tier = MOCK.priceTiers.find(t => t.id === dish.priceTierId);
  document.getElementById('dishTags').innerHTML = `
    ${dish.realTag ? `<span class="tag ${MOCK.realClass(dish.realTag)}">${MOCK.realName(dish.realTag)}</span>` : ''}
    ${tier ? `<span class="tag ${MOCK.tierClass(tier.id)}">${tier.name}</span>` : ''}
    ${(dish.tasteTags || []).map(t => `<span class="tag-dark">${t}</span>`).join('')}
  `;

  document.getElementById('dishName').textContent = dish.name;
  document.getElementById('dishDesc').textContent = dish.desc || '暂无简介';
  document.getElementById('dishDesc').style.display = dish.desc ? '' : 'none';
  document.getElementById('dishPrice').innerHTML = dish.price
    ? `<span class="dish-price__unit">¥</span>${dish.price}` : '';
  document.getElementById('dishTime').textContent = MOCK.timeAgo(dish.publishedAt) + '发布';

  // 店铺
  document.getElementById('smLogo').src = shop.logo;
  document.getElementById('smName').textContent = shop.name;
  document.getElementById('smMeta').textContent = `${shop.cuisine} · ${shop.distance}km · ${shop.hours}`;

  // 互动数
  document.getElementById('likeNum').textContent = MOCK.fmtNum(dish.stats.likes);
  document.getElementById('favNum').textContent = MOCK.fmtNum(dish.stats.favorites);

  renderComments();
}

function renderComments() {
  const list = MOCK.getDishComments(dish.id);
  document.getElementById('cmCount').textContent = list.length ? '共 ' + list.length + ' 条' : '';

  const el = document.getElementById('cmList');
  if (!list.length) {
    el.innerHTML = '<div class="empty" style="color:rgba(255,255,255,.4);padding:40px 0">' +
      '<div class="empty__icon">💬</div><div class="empty__text">还没有评论</div>' +
      '<div class="empty__hint">来抢沙发吧</div></div>';
    return;
  }

  el.innerHTML = list.map(c => `
    <div class="cm-item">
      <div class="cm-avatar"><img src="${c.avatar}"></div>
      <div class="cm-body">
        <div class="cm-name">${c.userName}</div>
        <div class="cm-text">${escapeHtml(c.content)}</div>
        <div class="cm-time">${MOCK.timeAgo(c.at)}</div>
        ${c.reply ? `
          <div class="cm-reply">
            <div class="cm-reply__tag">🏪 商家回复</div>
            <div class="cm-reply__text">${escapeHtml(c.reply.content)}</div>
            <div class="cm-reply__time">${MOCK.timeAgo(c.reply.at)}</div>
          </div>
        ` : ''}
      </div>
    </div>
  `).join('');
}

/* ---------- 登录拦截 ---------- */
function requireLogin() {
  if (MOCK.currentUser.loggedIn) return true;
  if (confirm('登录后才能操作，现在去登录？')) location.href = 'login.html';
  return false;
}

/* ---------- 互动 ---------- */
function toggleLike() {
  if (!requireLogin()) return;
  state.liked = !state.liked;
  dish.stats.likes += state.liked ? 1 : -1;
  document.getElementById('btnLike').classList.toggle('is-on', state.liked);
  document.getElementById('likeNum').textContent = MOCK.fmtNum(dish.stats.likes);
  track('like', { dishId: dish.id, on: state.liked });
}

function toggleFav() {
  if (!requireLogin()) return;
  state.faved = !state.faved;
  dish.stats.favorites += state.faved ? 1 : -1;
  document.getElementById('btnFav').classList.toggle('is-on', state.faved);
  document.getElementById('favNum').textContent = MOCK.fmtNum(dish.stats.favorites);
  track('favorite', { dishId: dish.id, on: state.faved });
}

function goShop() {
  location.href = 'shop.html?id=' + shop.id;
}

function goNav() {
  toast('导航至：' + shop.address);
}

/* ---------- 评论 ---------- */
function onInput() {
  const v = document.getElementById('cmInput').value.trim();
  document.getElementById('cmSend').classList.toggle('is-disabled', !v);
}

function sendComment() {
  const input = document.getElementById('cmInput');
  const v = input.value.trim();
  if (!v) return;
  if (!requireLogin()) return;

  MOCK.comments.unshift({
    id: 'c_' + Date.now(),
    dishId: dish.id,
    userId: MOCK.currentUser.id,
    userName: MOCK.currentUser.name,
    avatar: MOCK.currentUser.avatar,
    content: v,
    at: fmtNow(),
    reply: null
  });

  dish.stats.comments += 1;
  input.value = '';
  onInput();
  renderComments();
  toast('评论已发布');
  track('comment', { dishId: dish.id });
}

function fmtNow() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-show'), 1600);
}

function track(event, data) { console.log('[track]', event, data); }
</script>
</body>
</html>
