# 用 -Dspring-boot.run.profiles=mysql 启用
server:
  port: 8080

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/eatwhat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "请改成你的密码"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: false

eatwhat:
  seed: true

logging:
  level:
    com.eatwhat: DEBUG
