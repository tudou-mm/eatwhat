# 用 -Dspring-boot.run.profiles=mysql 启用
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/eatwhat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=请改成你的密码

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

eatwhat.seed=true

logging.level.com.eatwhat=DEBUG
