# ===== 默认使用 H2 内存库，免安装直接跑 =====
server:
  port: 8080

spring:
  datasource:
    url: "jdbc:h2:mem:eatwhat;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      # 冻结规则：视频 ≤20MB。上限留点余量给 multipart 包头，
      # 真正的业务校验在 UploadController 里按 config 精确卡。
      max-file-size: 24MB
      max-request-size: 32MB

# 首次启动灌演示数据
eatwhat:
  seed: true

  # ---------- 鉴权 ----------
  auth:
    # 演示用超管账号。⚠️ 上线必须改，或用环境变量覆盖
    adminAccount: admin
    adminPassword: admin123
    # 商家端原型阶段的统一密码（正式上线应改走短信验证码登录，接口已就绪）
    merchantPassword: "123456"

    # 短信验证码调试回显：true 时 /api/auth/sms-code 会把验证码放进 devCode 字段
    # ⚠️ 生产必须 false —— 否则验证码跟着接口返回，等于没校验
    echoSmsCode: true

    # 验证码寿命与频率
    smsCodeExpireSeconds: 300      # 5 分钟有效
    smsResendSeconds: 60           # 同号 60 秒内不能重发
    smsMaxTries: 5                 # 错 5 次作废，防暴力试码
    smsIpMaxPerHour: 30            # 同 IP 每小时发码上限，防短信轰炸

    # 登录防撞库
    maxLoginAttempts: 5            # 同账号连续失败几次开始锁
    lockMinutes: 15                # 锁多久（锁定期间密码正确也拒绝）
    ipMaxPerMinute: 60             # 同 IP 每分钟登录尝试上限
                                   # （正常用户 1 分钟登不了 60 次，但回归脚本跑两遍会）

  # ---------- JWT ----------
  jwt:
    # 密钥**不进代码仓库**：用环境变量 EATWHAT_JWT_SECRET 注入，
    # 这里只是本地开发用的默认值。跑在 prod profile 下若仍是这个默认值，
    # 服务会直接拒绝启动（见 JwtUtil）——用默认密钥上线等于人人都能签 admin token。
    secret: ${EATWHAT_JWT_SECRET:eatwhat-dev-only-secret-please-override-32b}
    expireHours: 168

  # ---------- 文件上传 ----------
  upload:
    # 落盘目录，相对 server/ 运行目录
    dir: ./uploads
    # 对外访问前缀（WebConfig 会把它映射到上面的磁盘目录）
    publicPath: /uploads
    maxImageMb: 5
    maxVideoMb: 20

  # ---------- 跨域白名单 ----------
  # 逗号分隔（Spring 会按 , 切成数组）。支持通配写法，如 http://localhost:[*]。
  # file:// 直开时 Origin 为 null 会被拦，那种场景请走 `python dev.py`。
  cors:
    allowedOrigins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080"

logging:
  level:
    root: INFO
    com.eatwhat: DEBUG
