# ===== 默认使用 H2 内存库，免安装直接跑 =====
server:
  port: 8080

spring:
  datasource:
    url: "jdbc:h2:mem:eatwhat;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# 首次启动灌演示数据
eatwhat:
  seed: true

logging:
  level:
    root: INFO
    com.eatwhat: DEBUG
