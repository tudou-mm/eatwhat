<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据概览 · 平台端</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 20px; }

  .kpi {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 20px; position: relative;
  }
  .kpi__label { font-size: 13px; color: var(--text-3); margin-bottom: 10px; }
  .kpi__num { font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi__delta { font-size: 12px; margin-top: 8px; display: flex; align-items: center; gap: 4px; }
  .kpi__delta--up { color: var(--success); }
  .kpi__delta--down { color: var(--danger); }
  .kpi__delta--flat { color: var(--text-4); }

  .kpi--alert .kpi__num { color: var(--danger); }
  .kpi--link { cursor: pointer; }
  .kpi--link:hover { border-color: var(--brand); }

  .grid2 { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }

  .chart-box { height: 240px; position: relative; padding: 10px 0; }

  .bars { display: flex; align-items: flex-end; gap: 14px; height: 100%; padding: 0 8px; }

  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }

  .bar {
    width: 100%; max-width: 38px; border-radius: 6px 6px 0 0;
    background: linear-gradient(180deg, #FE2C55, #FF8FA5);
    transition: height .4s; position: relative;
  }
  .bar__val {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--text-2); font-weight: 500;
  }
  .bar__label { font-size: 12px; color: var(--text-3); }

  .todo-item {
    display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .todo-item:last-child { border-bottom: none; }
  .todo-item__icon {
    width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .todo-item__main { flex: 1; min-width: 0; }
  .todo-item__title { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .todo-item__desc { font-size: 12px; color: var(--text-3); }

  .rank-mini {
    display: flex; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  .rank-mini:last-child { border-bottom: none; }
  .rank-mini__no {
    width: 22px; height: 22px; border-radius: 6px; background: var(--bg-hover);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--text-2); flex-shrink: 0;
  }
  .rank-mini__no--top { background: var(--brand); color: #fff; }
  .rank-mini__name { font-size: 13px; flex: 1; }
  .rank-mini__val { font-size: 12px; color: var(--text-3); }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar__logo"><div class="sidebar__logo-dot"></div><span>吃什么 · 平台</span></div>
    <nav class="sidebar__nav">
      <a class="nav-item is-active" href="dashboard.html">数据概览</a>
      <a class="nav-item" href="audit-shops.html">商家审核 <span class="nav-item__badge" id="navAuditBadge"></span></a>
      <a class="nav-item" href="shops.html">店铺管理</a>
      <a class="nav-item" href="contents.html">内容管理 <span class="nav-item__badge" id="navReportBadge"></span></a>
      <a class="nav-item" href="ranking.html">推荐排名</a>
      <a class="nav-item" href="rules.html">发布规则</a>
      <a class="nav-item" href="config.html">价格档 / 标签</a>
      <a class="nav-item" href="users.html">用户管理</a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar__title">数据概览</div>
      <div class="topbar__spacer"></div>
      <div class="topbar__user">
        <div class="avatar">运</div>
        <span style="font-size:13px">平台运营</span>
      </div>
    </header>

    <div class="content">

      <!-- KPI -->
      <div class="kpi-grid">
        <div class="kpi kpi--link" onclick="location.href='shops.html'">
          <div class="kpi__label">在营店铺</div>
          <div class="kpi__num" id="kpiShop">—</div>
          <div class="kpi__delta kpi__delta--flat" id="kpiShopD">—</div>
        </div>
        <div class="kpi kpi--link" style="cursor:pointer" onclick="location.href='audit-shops.html'">
          <div class="kpi__label">待审核商家</div>
          <div class="kpi__num" id="kpiPending">—</div>
          <div class="kpi__delta kpi__delta--flat" id="kpiPendingD">—</div>
        </div>
        <div class="kpi kpi--link" onclick="location.href='contents.html'">
          <div class="kpi__label">今日发布菜品</div>
          <div class="kpi__num" id="kpiDishToday">—</div>
          <div class="kpi__delta kpi__delta--flat" id="kpiDishD">—</div>
        </div>
        <div class="kpi kpi--link" onclick="location.href='users.html'">
          <div class="kpi__label">注册用户</div>
          <div class="kpi__num" id="kpiUser">—</div>
          <div class="kpi__delta kpi__delta--flat" id="kpiUserD">—</div>
        </div>
        <div class="kpi kpi--link kpi--alert" onclick="location.href='contents.html'">
          <div class="kpi__label">待处理举报</div>
          <div class="kpi__num" id="kpiReport">—</div>
          <div class="kpi__delta kpi__delta--flat" id="kpiReportD">—</div>
        </div>
      </div>

      <div class="grid2">
        <div>
          <!-- 趋势图 -->
          <div class="card mb-16">
            <div class="card__head">
              <div class="card__title">近 7 日发布趋势</div>
              <div class="card__spacer"></div>
              <div class="card__subtitle">单位：条</div>
            </div>
            <div class="card__body">
              <div class="chart-box">
                <div class="bars" id="bars"></div>
              </div>
            </div>
          </div>

          <!-- 热店铺 -->
          <div class="card">
            <div class="card__head">
              <div class="card__title">今日热门店铺</div>
              <div class="card__subtitle">按浏览量排序</div>
            </div>
            <div class="card__body" style="padding-top:4px" id="hotShops"></div>
          </div>
        </div>

        <!-- 待办 -->
        <div class="card">
          <div class="card__head">
            <div class="card__title">待办事项</div>
          </div>
          <div class="card__body" style="padding-top:4px" id="todos"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="../assets/data/mock.js"></script>
<script src="../assets/js/api.js"></script>
<script>
(function init() {
  var o = overview();

  // ---- KPI ----
  // 「在营」= 已上线可营业（normal + muted）；
  // shopCount 是含待审核/已驳回的总数，用在这里会虚高，不要直接拿
  var onShelf = (o.shopNormal || 0) + (o.shopMuted || 0);
  document.getElementById('kpiShop').textContent = onShelf;
  document.getElementById('kpiShopD').textContent =
    o.shopBanned ? ('已封禁 ' + o.shopBanned + ' 家')
      : (o.shopMuted ? (o.shopMuted + ' 家禁言中') : '全部正常营业');

  setKpi('kpiPending', 'kpiPendingD', o.shopPending, o.shopPending ? '需尽快处理' : '全部处理完啦', o.shopPending > 0);

  document.getElementById('kpiDishToday').textContent = o.dishToday;
  document.getElementById('kpiDishD').textContent = o.dishDeltaMsg;

  document.getElementById('kpiUser').textContent = MOCK.fmtNum(o.userCount);
  document.getElementById('kpiUserD').textContent = '累计注册';

  setKpi('kpiReport', 'kpiReportD', o.reportPending,
    o.reportPending ? '含恶意差评' : '暂无待处理', o.reportPending > 0);

  // ---- 侧边栏角标 ----
  setBadge('navAuditBadge', o.shopPending);
  setBadge('navReportBadge', o.reportPending);

  // ---- 趋势柱状 ----
  var data = o.trend;
  var max = Math.max.apply(null, data.map(function (x) { return x.v; }).concat([1]));
  document.getElementById('bars').innerHTML = data.map(function (x) {
    var h = Math.max(x.v / max * 100, x.v > 0 ? 4 : 0);
    return '<div class="bar-col">' +
      '<div style="flex:1;display:flex;align-items:flex-end;width:100%;justify-content:center">' +
        '<div class="bar" style="height:' + h + '%">' +
          (x.v > 0 ? '<div class="bar__val">' + x.v + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="bar__label">' + x.d + '</div>' +
    '</div>';
  }).join('');

  // ---- 热门店铺：只看真正在营的店，待审核/封禁的不该出现在榜单 ----
  var hot = (MOCK.shops || [])
    .filter(function (s) { return s.status === 'normal' || s.status === 'muted'; })
    .sort(function (a, b) { return b.stats.views - a.stats.views; })
    .slice(0, 6);

  document.getElementById('hotShops').innerHTML = hot.length ? hot.map(function (s, i) {
    return '<div class="rank-mini">' +
      '<div class="rank-mini__no ' + (i < 3 ? 'rank-mini__no--top' : '') + '">' + (i + 1) + '</div>' +
      '<div style="width:28px;height:28px;border-radius:7px;overflow:hidden;background:var(--bg-hover)">' +
        '<img src="' + s.logo + '" style="width:100%;height:100%;object-fit:cover">' +
      '</div>' +
      '<div class="rank-mini__name">' + s.name + '</div>' +
      '<div class="rank-mini__val">' + MOCK.fmtNum(s.stats.views) + ' 浏览</div>' +
    '</div>';
  }).join('') : '<div class="empty"><div class="empty__icon">🏪</div><div class="empty__text">暂无数据</div></div>';

  // ---- 待办：数量为 0 的项不显示，避免列一堆"去处理"结果是空的 ----
  var todos = [];
  if (o.shopPending > 0) {
    todos.push(todo('🏪', '#FFF7E6', '#D46B08',
      o.shopPending + ' 家商家待审核',
      (MOCK.pendingShops || []).slice(0, 2).map(function (s) { return s.name; }).join('、') || '查看审核队列',
      'audit-shops.html', '去处理'));
  }
  if (o.reportPending > 0) {
    todos.push(todo('⚠', '#FFF1F0', 'var(--danger)',
      o.reportPending + ' 条举报待处理',
      '来自 ' + uniqueReporter() + ' 的举报',
      'contents.html', '去处理'));
  }
  var topPinned = (MOCK.shops || []).filter(function (s) { return s.pinned; });
  if (topPinned.length) {
    todos.push(todo('📌', '#E6F4FF', 'var(--info)',
      '推荐排名待复核',
      topPinned[0].name + ' 等 ' + topPinned.length + ' 家处于置顶',
      'ranking.html', '去调整'));
  }
  if (o.shopMuted > 0) {
    todos.push(todo('🔇', '#F5F5F5', 'var(--text-3)',
      o.shopMuted + ' 家店铺处于禁言',
      '禁言店铺不能发布和回评',
      'shops.html', '去查看'));
  }

  document.getElementById('todos').innerHTML = todos.length ? todos.join('')
    : '<div class="empty" style="padding:40px 0"><div class="empty__icon">✅</div>' +
      '<div class="empty__text">没有待办事项</div>' +
      '<div class="empty__hint">都处理完啦</div></div>';
})();

/* ---------- 数据源 ---------- */

/**
 * 平台端概览数据。
 * 后端在线时直接用 /admin/overview 的权威数据；
 * 纯本地假数据模式下用 MOCK 数组现算，保证原型照样能演示。
 */
function overview() {
  var o = MOCK.overview;
  var shops = MOCK.shops || [];
  var dishes = MOCK.dishes || [];
  var users = MOCK.users || [];
  var reports = MOCK.reports || [];
  var pending = MOCK.pendingShops || [];

  if (o && o.shopCount != null) {
    return {
      shopCount: o.shopCount,
      shopNormal: o.shopNormal,
      shopMuted: o.shopMuted,
      shopBanned: o.shopBanned,
      shopPending: o.shopPending,
      userCount: o.userCount,
      dishToday: o.dishToday,
      reportPending: o.reportPending,
      trend: (o.trend && o.trend.length) ? o.trend : localTrend(dishes),
      dishDeltaMsg: deltaMsg(o.trend)
    };
  }

  var today = startOfDay(new Date());
  var normal = shops.filter(function (s) { return s.status === 'normal'; });
  var muted = shops.filter(function (s) { return s.status === 'muted'; });
  var banned = shops.filter(function (s) { return s.status === 'banned'; });
  var t = localTrend(dishes);

  return {
    shopCount: shops.length,
    shopNormal: normal.length,
    shopMuted: muted.length,
    shopBanned: banned.length,
    shopPending: pending.length,
    userCount: users.length,
    dishToday: dishes.filter(function (d) {
      return new Date(String(d.publishedAt).replace(/-/g, '/')) >= today;
    }).length,
    reportPending: reports.filter(function (r) { return r.status === 'pending'; }).length,
    trend: t,
    dishDeltaMsg: deltaMsg(t)
  };
}

/** 近 7 日发布趋势：按 publishedAt 归到日 */
function localTrend(dishes) {
  var wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var out = [];
  for (var i = 6; i >= 0; i--) {
    var day = new Date();
    day.setHours(0, 0, 0, 0);
    day.setDate(day.getDate() - i);
    var next = new Date(day.getTime() + 86400000);
    var cnt = dishes.filter(function (d) {
      var ts = new Date(String(d.publishedAt).replace(/-/g, '/'));
      return ts >= day && ts < next;
    }).length;
    out.push({ d: i === 0 ? '今日' : wk[day.getDay()], v: cnt });
  }
  return out;
}

/** 今日 vs 昨日，给 KPI 副标题用 */
function deltaMsg(trend) {
  if (!trend || trend.length < 2) return '—';
  var today = trend[trend.length - 1].v;
  var yest = trend[trend.length - 2].v;
  var diff = today - yest;
  if (diff === 0) return '与昨日持平';
  return (diff > 0 ? '↑ 较昨日 +' : '↓ 较昨日 ') + diff;
}

/* ---------- 小工具 ---------- */

function startOfDay(d) { d.setHours(0, 0, 0, 0); return d; }

function setKpi(numId, deltaId, value, msg, alert) {
  document.getElementById(numId).textContent = value;
  document.getElementById(deltaId).textContent = msg;
}

function setBadge(id, n) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = n;
  el.style.display = n ? '' : 'none';
}

function uniqueReporter() {
  var names = (MOCK.reports || []).filter(function (r) { return r.status === 'pending'; })
    .map(function (r) { return r.reporter; });
  var uniq = names.filter(function (n, i) { return names.indexOf(n) === i; });
  return uniq.slice(0, 2).join('、') || '用户';
}

function todo(icon, bg, color, title, desc, href, btn) {
  return '<div class="todo-item">' +
    '<div class="todo-item__icon" style="background:' + bg + ';color:' + color + '">' + icon + '</div>' +
    '<div class="todo-item__main">' +
      '<div class="todo-item__title">' + title + '</div>' +
      '<div class="todo-item__desc">' + desc + '</div>' +
    '</div>' +
    '<a class="btn btn--sm btn--outline" href="' + href + '">' + btn + '</a>' +
  '</div>';
}
</script>
</body>
</html>
